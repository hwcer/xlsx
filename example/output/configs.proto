syntax = "proto3";

// 打表全局对象
// 普通掉落对象
message Reward{ 
    int32 id = 1; 
    int32 num = 2; 
}


//全局对象......

//数据对象......

// Sheet:
// File:\全局事件.xlsx
message Events{
	int32 login = 1; //1
	int32 score = 2; //2
	int32 order = 3; //3
}
// Sheet:
// File:\全局事件.xlsx
message Emitter{
	int32 Id = 1; //
	string Name = 2; //
	string Type = 3; //
	int32 Daily = 4; //
	int32 Record = 5; //
	int32 Events = 6; //
	int32 Update = 7; //
	int32 Replace = 8; //
}
// Sheet:
// File:\测试表.xlsx
message Activity{
	int32 Id = 1; //
	string TType = 2; //
	repeated int32 Arr = 3; //
	Drop Obj = 4; //
	repeated Item ArrObj = 5; //id
	repeated float ArrFloat = 6; //
	Reward Items = 7; //
}
// Sheet:
// File:\测试表.xlsx
message Base{
	string Id = 1; //
}
// Sheet:
// File:\测试表.xlsx
message Baseenum{
	int32 lv = 1; //等级
	int64 exp = 2; //经验
	string name = 3; //名称
}
// Sheet:
// File:\测试表.xlsx
message BaseObj{
	int32 lv = 1; //等级
